# Metadata-pair relocation and the extent defragmenter.
#
# Run with tests/littlefs_run.sh. The helpers live in
# tests/relocate_test_helpers.h, injected with --include.

# ---------------------------------------------------------------------------
# Mechanism: relocate one directory.
# ---------------------------------------------------------------------------

[cases.test_relocate_dir_preserves_contents]
defines.READ_SIZE = [256]
defines.PROG_SIZE = [256]
defines.ERASE_SIZE = [4096]
defines.ERASE_COUNT = [64]
code = '''
    lfs_t lfs;
    lfs_format(&lfs, cfg) => 0;
    lfs_mount(&lfs, cfg) => 0;
    lfs_mkdir(&lfs, "apps") => 0;
    lfs_mkdir(&lfs, "apps/app") => 0;
    rel_write(&lfs, "apps/app/f0", 5000, 1) => 0;
    rel_write(&lfs, "apps/app/f1", 100, 2) => 0;
    rel_write(&lfs, "apps/other", 300, 3) => 0;

    lfs_block_t pair[2];
    rel_pair_of(&lfs, "apps/app", pair) => 0;
    lfs_block_t before[2] = {pair[0], pair[1]};
    lfs_ssize_t size_before = lfs_fs_size(&lfs);

    lfs_ext_relocate_dir(&lfs, pair) => 0;

    rel_pair_of(&lfs, "apps/app", pair) => 0;
    assert(rel_new_block(before, pair));
    rel_check(&lfs, "apps/app/f0", 5000, 1) => 0;
    rel_check(&lfs, "apps/app/f1", 100, 2) => 0;
    rel_check(&lfs, "apps/other", 300, 3) => 0;
    // one metadata block rewritten, the old one freed: no leak, no growth
    lfs_fs_size(&lfs) => size_before;

    // the new pair is the live one after a remount
    lfs_unmount(&lfs) => 0;
    lfs_mount(&lfs, cfg) => 0;
    rel_check(&lfs, "apps/app/f0", 5000, 1) => 0;
    lfs_block_t after[2];
    rel_pair_of(&lfs, "apps/app", after) => 0;
    assert(rel_same_pair(after, pair));
    lfs_unmount(&lfs) => 0;
'''

