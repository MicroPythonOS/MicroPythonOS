name: Check app manifest versions

on:
  pull_request:
    branches:
      - main
    paths:
      - 'internal_filesystem/apps/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  versions:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Check that changed apps bumped MANIFEST.JSON
        run: python3 scripts/check_app_versions.py --changed --base origin/${{ github.base_ref }}
