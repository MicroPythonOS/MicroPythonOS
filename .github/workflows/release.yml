  build-macos-arm:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
      LDFLAGS: -L/opt/homebrew/opt/libffi/lib
      CPPFLAGS: -I/opt/homebrew/opt/libffi/include
      PKG_CONFIG_PATH: /opt/homebrew/opt/libffi/lib/pkgconfig
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_NOHASHDIR: true

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install dependencies via Homebrew
        run: |
          xcode-select --install || true
          brew install pkg-config libffi ninja make sdl2-compat ccache

      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-v1-${{ runner.os }}-${{ runner.arch }}-macos-arm64-${{ github.sha }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-${{ runner.arch }}-macos-arm64-

      - name: Configure compiler cache
        run: |
          echo "$(brew --prefix ccache)/libexec" >> "$GITHUB_PATH"
          ccache --max-size 1G
          ccache --zero-stats

      - name: Extract OS version
        id: version
        run: |
          OS_VERSION=$(grep "release = " internal_filesystem/lib/mpos/build_info.py | cut -d "=" -f 2 | cut -d "#" -f 1 | tr -d " " | tr -d '"')
          echo "OS_VERSION=$OS_VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $OS_VERSION"

      - name: Build LVGL MicroPython for macOS ARM
        run: |
          ./scripts/build_mpos.sh macOS
          cp lvgl_micropython/build/lvgl_micropy_macOS lvgl_micropython/build/MicroPythonOS_arm64_macOS_${{ steps.version.outputs.OS_VERSION }}.bin

      - name: Upload macOS ARM binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MicroPythonOS_arm64_macOS_${{ steps.version.outputs.OS_VERSION }}.bin
          path: lvgl_micropython/build/MicroPythonOS_arm64_macOS_${{ steps.version.outputs.OS_VERSION }}.bin


  build-macos-intel:
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
      LDFLAGS: -L/usr/local/opt/libffi/lib
      CPPFLAGS: -I/usr/local/opt/libffi/include
      PKG_CONFIG_PATH: /usr/local/opt/libffi/lib/pkgconfig
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_NOHASHDIR: true

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install dependencies via Homebrew
        run: |
          xcode-select --install || true
          brew install pkg-config libffi ninja make SDL2 ccache

      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-v1-${{ runner.os }}-${{ runner.arch }}-macos-intel-${{ github.sha }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-${{ runner.arch }}-macos-intel-

      - name: Configure compiler cache
        run: |
          echo "$(brew --prefix ccache)/libexec" >> "$GITHUB_PATH"
          ccache --max-size 1G
          ccache --zero-stats

      - name: Extract OS version
        id: version
        run: |
          OS_VERSION=$(grep "release = " internal_filesystem/lib/mpos/build_info.py | cut -d "=" -f 2 | cut -d "#" -f 1 | tr -d " " | tr -d '"')
          echo "OS_VERSION=$OS_VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $OS_VERSION"

      - name: Build LVGL MicroPython for macOS Intel
        run: |
          ./scripts/build_mpos.sh macOS
          cp lvgl_micropython/build/lvgl_micropy_macOS lvgl_micropython/build/MicroPythonOS_intel_macOS_${{ steps.version.outputs.OS_VERSION }}.bin

      - name: Upload macOS Intel binary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MicroPythonOS_intel_macOS_${{ steps.version.outputs.OS_VERSION }}.bin
          path: lvgl_micropython/build/MicroPythonOS_intel_macOS_${{ steps.version.outputs.OS_VERSION }}.bin


  build-web:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install and cache APT dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: build-essential libffi-dev pkg-config cmake ninja-build
          version: apt-v2-ubuntu-24.04-${{ runner.arch }}
          execute_install_scripts: true

      - name: Set up Emscripten SDK
        uses: mymindstorm/setup-emsdk@4528d102f7230f0e7b276855c01ea1159be0e984 # v16
        with:
          version: 6.0.0
          actions-cache-folder: emsdk-cache

      - name: Extract OS version
        id: version
        run: |
          OS_VERSION=$(grep "release = " internal_filesystem/lib/mpos/build_info.py | cut -d "=" -f 2 | cut -d "#" -f 1 | tr -d " " | tr -d '"')
          echo "OS_VERSION=$OS_VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $OS_VERSION"

      - name: Build web (WebAssembly/Emscripten) target
        run: ./scripts/build_mpos.sh web

      - name: Package web export as zip
        run: |
          zip -r MicroPythonOS_web_${{ steps.version.outputs.OS_VERSION }}.zip web/

      - name: Upload web zip
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MicroPythonOS_web_${{ steps.version.outputs.OS_VERSION }}.zip
          path: MicroPythonOS_web_${{ steps.version.outputs.OS_VERSION }}.zip


  release:
    needs:
      - build-esp32
      - build-esp32s3
      - build-esp32-small
      - build-unphone
      - build-linux-arm64
      - build-linux-x64
      - build-macos-arm
      - build-macos-intel
      - build-web
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts

      - name: Flatten artifact directories
        run: |
          find release-artifacts -type f -exec mv {} release-artifacts/ \;
          find release-artifacts -type d -empty -delete
          ls -la release-artifacts/

      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          name: ${{ github.ref_name }}
          files: release-artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: false
