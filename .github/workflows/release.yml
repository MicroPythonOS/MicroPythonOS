name: Release

on:
  push:
    tags:
      - '*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read

    env:
      COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Download artifacts from CI runs on this commit
        run: |
          RUN_IDS=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&per_page=100" | python3 -c "
          import json, sys, os
          data = json.load(sys.stdin)
          sha = os.environ['COMMIT_SHA']
          ids = [str(r['id']) for r in data['workflow_runs'] if r.get('head_sha') == sha and r.get('conclusion') == 'success']
          if not ids:
              sys.stderr.write(f'No successful CI runs found for commit {sha}.\n')
              sys.stderr.write('Push to main first, let CI pass, then tag.\n')
              sys.exit(1)
          sys.stderr.write(f'Found {len(ids)} successful CI run(s)\n')
          for r in data['workflow_runs']:
              if r.get('head_sha') == sha and r.get('conclusion') == 'success':
                  sys.stderr.write(f'  {r[\"id\"]}  {r[\"name\"]}\n')
          print(' '.join(ids))
          ")

          for run_id in $RUN_IDS; do
            echo "Downloading artifacts from run $run_id ..."
            gh run download -R "$GITHUB_REPOSITORY" "$run_id" -D release-artifacts
          done

      - name: Flatten artifact directories
        run: |
          mkdir -p flat
          find release-artifacts -type f -exec mv {} flat/ \;
          rm -rf release-artifacts
          mv flat release-artifacts
          ls -la release-artifacts/

      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          name: ${{ github.ref_name }}
          files: release-artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: false
