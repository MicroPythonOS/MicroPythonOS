name: Release

on:
  push:
    tags:
      - '*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read

    env:
      GH_REPO: ${{ github.repository }}
      COMMIT_SHA: ${{ github.sha }}

    steps:
      - name: Download artifacts from CI runs on this commit
        run: |
          set -euo pipefail

          RUN_IDS=$(gh run list -R "$GH_REPO" -b main --json databaseId,headSha,workflowName,conclusion --limit 100 | python3 -c "
          import json, sys, os
          runs = json.load(sys.stdin)
          sha = os.environ.get('COMMIT_SHA', '')
          success_ids = [str(r['databaseId']) for r in runs if r['headSha'] == sha and r['conclusion'] == 'success']
          if not success_ids:
              sys.stderr.write(f'No successful CI runs found for commit {sha}.\n')
              sys.stderr.write('Push to main first, let CI pass, then tag.\n')
              sys.exit(1)
          sys.stderr.write(f'Found {len(success_ids)} successful CI run(s)\n')
          for r in runs:
              if r['headSha'] == sha and r['conclusion'] == 'success':
                  sys.stderr.write(f'  {r[\"databaseId\"]}  {r[\"workflowName\"]}\n')
          print(' '.join(success_ids))
          ")

          for run_id in $RUN_IDS; do
            echo "Downloading artifacts from run $run_id ..."
            gh run download -R "$GH_REPO" "$run_id" -D release-artifacts
          done

      - name: Flatten artifact directories
        run: |
          mkdir -p flat
          find release-artifacts -type f -exec mv {} flat/ \;
          rm -rf release-artifacts
          mv flat release-artifacts
          ls -la release-artifacts/

      - name: Create draft release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          draft: true
          name: ${{ github.ref_name }}
          files: release-artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          make_latest: false
