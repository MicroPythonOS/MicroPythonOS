name: Release

on:
  push:
    tags:
      - '*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-esp32:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MPOS_CCACHE: 1
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_NOHASHDIR: true

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install and cache APT dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          packages: >-
            build-essential libffi-dev pkg-config cmake ninja-build ccache
            gnome-desktop-testing libasound2-dev libpulse-dev libaudio-dev
            libjack-dev libsndio-dev libx11-dev libxext-dev libxrandr-dev
            libxcursor-dev libxfixes-dev libxi-dev libxss-dev
            libxkbcommon-dev libdrm-dev libgbm-dev libgl1-mesa-dev
            libgles2-mesa-dev libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev
            libudev-dev fcitx-libs-dev libpipewire-0.3-dev libwayland-dev
            libdecor-0-dev libv4l-dev
          version: apt-v2-ubuntu-24.04-${{ runner.arch }}
          execute_install_scripts: true

      - name: Restore ESP-IDF tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.espressif
          key: esp-idf-tools-v1-5.5.1-${{ runner.os }}-${{ runner.arch }}

      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-v1-${{ runner.os }}-${{ runner.arch }}-linux-esp32-${{ github.sha }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-${{ runner.arch }}-linux-esp32-

      - name: Configure compiler cache
        run: |
          echo "/usr/lib/ccache" >> "$GITHUB_PATH"
          ccache --max-size 1G
          ccache --zero-stats

      - name: Extract OS version
        id: version
        run: |
          OS_VERSION=$(grep "release = " internal_filesystem/lib/mpos/build_info.py | cut -d "=" -f 2 | cut -d "#" -f 1 | tr -d " " | tr -d '"')
          echo "OS_VERSION=$OS_VERSION" >> $GITHUB_OUTPUT
          echo "Extracted version: $OS_VERSION"

      - name: Build LVGL MicroPython esp32
        run: |
          ./scripts/build_mpos.sh esp32
          mv lvgl_micropython/build/lvgl_micropy_ESP32_GENERIC-SPIRAM-16.bin lvgl_micropython/build/MicroPythonOS_esp32_${{ steps.version.outputs.OS_VERSION }}.bin
          mv lvgl_micropython/lib/micropython/ports/esp32/build-ESP32_GENERIC-SPIRAM/micropython.bin lvgl_micropython/lib/micropython/ports/esp32/build-ESP32_GENERIC-SPIRAM/MicroPythonOS_esp32_${{ steps.version.outputs.OS_VERSION }}.ota

      - name: Upload esp32 .bin
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MicroPythonOS_esp32_${{ steps.version.outputs.OS_VERSION }}.bin
          path: lvgl_micropython/build/MicroPythonOS_esp32_${{ steps.version.outputs.OS_VERSION }}.bin

      - name: Upload esp32 .ota
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: MicroPythonOS_esp32_${{ steps.version.outputs.OS_VERSION }}.ota
          path: lvgl_micropython/lib/micropython/ports/esp32/build-ESP32_GENERIC-SPIRAM/MicroPythonOS_esp32_${{ steps.version.outputs.OS_VERSION }}.ota


