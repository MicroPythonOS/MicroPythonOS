name: macOS Intel — minimal drawer test (debug)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-15-intel
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1
      LDFLAGS: -L/usr/local/opt/libffi/lib
      CPPFLAGS: -I/usr/local/opt/libffi/include
      PKG_CONFIG_PATH: /usr/local/opt/libffi/lib/pkgconfig
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_NOHASHDIR: true

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install dependencies via Homebrew
        run: |
          xcode-select --install || true
          brew install pkg-config libffi ninja make SDL2 ccache

      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-v1-${{ runner.os }}-${{ runner.arch }}-macos-intel-${{ github.sha }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-${{ runner.arch }}-macos-intel-

      - name: Configure compiler cache
        run: |
          echo "$(brew --prefix ccache)/libexec" >> "$GITHUB_PATH"
          ccache --max-size 1G
          ccache --zero-stats

      - name: Build LVGL MicroPython for macOS
        run: ./scripts/build_mpos.sh macOS

      - name: Disable native/viper decorators
        run: |
          find -L internal_filesystem -name '*.py' -type f -print0 | while IFS= read -r -d '' f; do
            if [ -L "$f" ]; then continue; fi
            sed -i.bak -E 's/^([[:space:]]*)(@micropython\.(native|viper)[[:space:]]*)$/\1#\2/' "$f"
          done
          find -L internal_filesystem -name '*.py.bak' -type f -exec rm -f {} +

      - name: Run drawer test only
        run: ./scripts/test_runner.py tests/test_graphical_topmenu_drawer.py --timeout 600

      - name: Restore native/viper decorators
        if: always()
        run: |
          find -L internal_filesystem -name '*.py' -type f -print0 | while IFS= read -r -d '' f; do
            if [ -L "$f" ]; then continue; fi
            sed -i.bak -E 's/^([[:space:]]*)#(@micropython\.(native|viper)[[:space:]]*)$/\1\2/' "$f"
          done
          find -L internal_filesystem -name '*.py.bak' -type f -exec rm -f {} +

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats
