name: Build LVGL MicroPython for macOS arm64 (M1)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch: # allow manual workflow starts

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14 # 15 was giving a blank screen for some MacOS users
    timeout-minutes: 60
    env:
      HOMEBREW_NO_AUTO_UPDATE: 1
      HOMEBREW_NO_ANALYTICS: 1

    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install dependencies via Homebrew
        run: |
          xcode-select --install || true # already installed on github
          #brew install pkg-config libffi ninja make SDL2 error 404 on https://formulae.brew.sh/api/formula/sdl2.json
          brew install pkg-config libffi ninja make sdl2-compat
          # After brew install libffi make sdl2 etc.
          export LDFLAGS="-L/opt/homebrew/opt/libffi/lib"
          export CPPFLAGS="-I/opt/homebrew/opt/libffi/include"
          export PKG_CONFIG_PATH="/opt/homebrew/opt/libffi/lib/pkgconfig:${PKG_CONFIG_PATH:-}"

      - name: Show version numbers
        run: |
          xcodebuild -version
          clang --version

      - name: Extract OS version
        id: version
        run: |
            OS_VERSION=$(grep "release = " internal_filesystem/lib/mpos/build_info.py | cut -d "=" -f 2 | cut -d "#" -f 1 | tr -d " " | tr -d '"')
            echo "OS_VERSION=$OS_VERSION" >> $GITHUB_OUTPUT
            echo "Extracted version: $OS_VERSION"

      - name: Build LVGL MicroPython for macOS dev
        run: |
          ./scripts/build_mpos.sh macOS
          cp lvgl_micropython/build/lvgl_micropy_macOS lvgl_micropython/build/MicroPythonOS_arm64_macOS_${{ steps.version.outputs.OS_VERSION }}.bin

      - name: Upload built binary as artifact
        uses: actions/upload-artifact@v7
        with:
          name: MicroPythonOS_arm64_macOS_${{ steps.version.outputs.OS_VERSION }}.bin
          path: lvgl_micropython/build/MicroPythonOS_arm64_macOS_${{ steps.version.outputs.OS_VERSION }}.bin
          retention-days: 7

      - name: Run syntax tests on macOS
        run: |
          ./tests/syntax.sh

      - name: Run unit tests on macOS
        run: |
          ./scripts/test_runner.py
